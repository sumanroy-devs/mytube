name: Make release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  # Certificate of the MyTube release key (release.keystore). Installed clients
  # effectively pin this value: an APK signed with anything else cannot be
  # installed as an update over an existing install.
  EXPECTED_SIGNER_SHA256: de74502f9b5800a5e2605cd701544c8d17e47df551e62145b64f4a3b45dd9468

jobs:
  release-for-github:
    name: "Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The in-app updater compares this tag against versionName; a mismatched
      # release would be re-offered forever (or never) after install.
      - name: Verify tag matches versionName
        run: |
          VERSION_NAME=$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v${VERSION_NAME}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION_NAME} — bump versionName first."
            exit 1
          fi

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build release with Gradle
        run: ./gradlew assembleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove keystore
        run: rm -f release.keystore

      # Guards the update path: unsigned or wrongly signed here is unrecoverable
      # for installed users, so fail the release rather than publish APKs that
      # cannot be installed as an update.
      - name: Verify release signing certificate
        run: |
          set -uo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the runner Android SDK."
            exit 1
          fi
          RELEASE_DIR="app/build/outputs/apk/release"

          status=0

          unsigned=$(find "$RELEASE_DIR" -name '*-unsigned.apk' | wc -l)
          if [ "$unsigned" -ne 0 ]; then
            echo "::error::Unsigned APKs in $RELEASE_DIR — are RELEASE_KEYSTORE_BASE64/STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD set?"
            ls -lah "$RELEASE_DIR"
            status=1
          fi

          count=$(find "$RELEASE_DIR" -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "::error::Expected 5 signed APKs (universal + 4 ABIs), found $count"
            ls -lah "$RELEASE_DIR"
            status=1
          fi

          for apk in $(find "$RELEASE_DIR" -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk'); do
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
              status=1
            else
              echo "OK $(basename "$apk") -> $actual"
            fi
          done
          exit $status

      - name: Copy build artifacts
        run: |
          set -euo pipefail

          apks=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")
          for abi in "${apks[@]}"; do
            src="app/build/outputs/apk/release/app-${abi}-release.apk"
            dst="mytube-${abi}-${GITHUB_REF_NAME}.apk"
            if [ ! -f "$src" ]; then
              echo "::error file=$src::Signed APK for $abi was not found"
              exit 1
            fi
            cp "$src" "$dst"
            checksum=$(sha256sum "$dst" | awk '{ print $1 }')
            varname="apk_${abi//-/_}_sha256"
            echo "$varname=$checksum" >> "$GITHUB_ENV"
          done

          ls -lah mytube-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MyTube ${{ github.ref_name }}
          body: |
            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | arm64-v8a | ${{ env.apk_arm64_v8a_sha256 }} |
            | armeabi-v7a | ${{ env.apk_armeabi_v7a_sha256 }} |
            | Universal | ${{ env.apk_universal_sha256 }} |
            | x86 | ${{ env.apk_x86_sha256 }} |
            | x86_64 | ${{ env.apk_x86_64_sha256 }} |
          files: |
            mytube-universal-${{ github.ref_name }}.apk
            mytube-arm64-v8a-${{ github.ref_name }}.apk
            mytube-armeabi-v7a-${{ github.ref_name }}.apk
            mytube-x86-${{ github.ref_name }}.apk
            mytube-x86_64-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
